name: xlist
description: Xlist project.
publish_to: 'none'
version: 1.1.1+1

environment:
  sdk: '>=2.19.4 <4.0.0'
  flutter: '>=1.12.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  media_kit: ^1.2.0
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.6
  floating: ^6.0.0

  get: ^4.6.5
  get_storage: ^2.0.3
  dio: ^5.0.1
  path: ^1.8.2
  floor: ^1.5.0
  sqflite: ^2.3.0
  jiffy: ^6.1.0
  crypto: ^3.0.3
  encrypt: ^5.0.3
  keframe: ^3.0.0
  charset: ^2.0.1
  wakelock_plus: ^1.8.0
  audio_wave: ^0.1.5
  share_plus: ^13.3.0
  photo_view: ^0.15.0
  file_picker: ^13.1.0
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  easy_refresh: ^3.3.1+2
  toggle_switch: ^2.1.0
  vivysub_utils: ^0.2.0
  path_provider: ^2.0.15
  in_app_review: ^2.0.6
  audio_service: ^0.18.19
  code_text_field: ^1.1.0
  adaptive_dialog: ^2.8.3
  dismissible_page: ^1.0.1
  pull_down_button: ^0.10.2
  device_info_plus: ^13.2.0
  flex_color_scheme: ^9.0.0
  package_info_plus: ^10.2.1
  permission_handler: ^13.0.2
  modal_bottom_sheet: ^3.0.0-pre
  image_gallery_saver_plus: ^5.1.1
  font_awesome_flutter: ^11.0.0
  cached_network_image: ^4.0.0
  subtitle_wrapper_package: ^2.1.1
  infinite_scroll_pagination: ^5.1.1
  syncfusion_flutter_pdfviewer: ^34.2.8
  flutter_svg: ^2.3.0
  flutter_phoenix: ^1.1.0
  flutter_slidable: ^4.0.3
  flutter_screenutil: ^5.6.0
  flutter_downloader: ^1.12.1
  flutter_smart_dialog: ^5.3.0
  flutter_inappwebview: ^6.0.0
  flutter_native_splash: ^2.2.19
  flutter_keyboard_visibility: ^7.0.1
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_gen: ^5.9.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.1.0
  build_runner: ^2.3.3
  json_serializable: ^6.5.4

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#121212"
  image: assets/common/logo-transparent.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#121212"
    image: assets/common/logo-transparent.png

flutter_app_name:
  name: "Xlist"

flutter_gen:
  output: lib/gen/
  line_length: 80

flutter_icons:
  android: true
  image_path: "assets/common/logo.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/common/
    - assets/images/

dependency_overrides:
  uuid: ^4.5.0
  # dynamic_color 2.x 起改用独立的 material_ui 包（其 ColorScheme/Color 与
  # Flutter 自带的是同名不同类）。
  #
  # 历史上这里钉在 1.7.0，因为 adaptive_dialog（仍用 flutter/material）会调用
  # DynamicColorPlugin.getAccentColor() 并吃下 material_ui 版的 Color —— 当时
  # 全项目都在 flutter/material 下，属真跨库，只会在运行时炸。
  #
  # Phase 3 起不再需要这个钉子：主壳仍是 flutter/material（约 50 个依赖依赖它），
  # 但已由 `ThemeBridge`（lib/components/theme_bridge.dart）在
  # MaterialApp.builder 上补了一层 material_ui 主题，两条线各自都有主题可用。
  # `Color` 本身是 dart:ui 的共享类，跨库传值不涉及类型身份问题。
  dynamic_color: ^2.1.0
  animations: ^3.0.0
