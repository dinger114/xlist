name: xlist
description: Xlist project.
publish_to: 'none'
version: 1.2.1+1

environment:
  # 下限用 ^3.13.0 而不是原来的 >=2.19.4：环境约束同时决定本包自己的
  # language version（原来解析出来是 2.19，低于全部现代依赖，build_runner
  # 每次 codegen 都会警告 "language version (2.19.0) does not match the
  # required range ^3.8.0"）。
  # 提到 3.13 是「零约束代价」——material_ui / cupertino_ui /
  # flex_color_scheme / flex_seed_scheme 这 4 个直接依赖本就要求 ^3.13.0，
  # 解析器无论如何都只能给 >=3.13.0 的 SDK，写进 pubspec 只是把既成事实显式化，
  # 同时把语言版本从 2.19 抬到 3.13。
  # 不用 >=3.0.0：那会把语言版本钉回 3.0，比现状好但与依赖不匹配。
  sdk: '^3.13.0'
  # 原为 '>=1.12.0'（Flutter 1.12 = 2019-02），完全失真且会误导人。
  # 3.47.0 是依赖树的实际地板（material_ui / cupertino_ui /
  # flex_color_scheme / flex_seed_scheme 均要求 >=3.47.0）。
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  media_kit: ^1.2.0
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.6
  floating: ^6.0.0

  get: ^4.6.5
  get_storage: ^2.0.3
  dio: ^5.0.1
  path: ^1.8.2
  floor: ^1.5.0
  sqflite: ^2.3.0
  jiffy: ^6.1.0
  crypto: ^3.0.3
  encrypt: ^5.0.3
  keframe: ^3.0.0
  charset: ^2.0.1
  wakelock_plus: ^1.8.0
  audio_wave: ^0.1.5
  share_plus: ^13.3.0
  photo_view: ^0.15.0
  file_picker: ^13.1.0
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  easy_refresh: ^3.3.1+2
  toggle_switch: ^2.1.0
  vivysub_utils: ^0.2.0
  path_provider: ^2.0.15
  in_app_review: ^2.0.6
  audio_service: ^0.18.19
  code_text_field: ^1.1.0
  adaptive_dialog: ^2.8.3
  dismissible_page: ^1.0.1
  pull_down_button: ^0.10.2
  device_info_plus: ^13.2.0
  flex_color_scheme: ^9.0.0
  package_info_plus: ^10.2.1
  permission_handler: ^13.0.2
  modal_bottom_sheet: ^3.0.0-pre
  image_gallery_saver_plus: ^5.1.1
  font_awesome_flutter: ^11.0.0
  cached_network_image: ^4.0.0
  subtitle_wrapper_package: ^2.1.1
  infinite_scroll_pagination: ^5.1.1
  syncfusion_flutter_pdfviewer: ^34.2.8
  flutter_svg: ^2.3.0
  flutter_markdown_plus: ^1.0.12
  flutter_phoenix: ^1.1.0
  flutter_slidable: ^4.0.3
  flutter_screenutil: ^5.6.0
  flutter_downloader: ^1.12.1
  flutter_smart_dialog: ^5.3.0
  flutter_inappwebview: ^6.0.0
  flutter_native_splash: ^2.2.19
  flutter_keyboard_visibility: ^7.0.1
  flutter_localizations:
    sdk: flutter

  # 以下 4 个之前是「传递依赖被直接 import」：代码能编，但依赖关系没写进
  # pubspec —— 上游哪天不再传递它们，就会直接编译失败（analyzer 的
  # depend_on_referenced_packages 就是在盯这个）。版本按 lock 里当前解析到的钉。
  material_ui: ^1.4.0 # flutter_smart_dialog 5.3 走的是 material_ui 版 Material
  json_annotation: ^4.12.0 # models/*.dart 的 @JsonSerializable
  flutter_highlight: ^0.7.0 # 代码高亮主题（code_text_field 提供渲染）
  highlight: ^0.7.0 # 同上，语言定义
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_gen: ^5.9.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.1.0
  build_runner: ^2.3.3
  json_serializable: ^6.5.4

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#121212"
  image: assets/common/logo-transparent.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#121212"
    image: assets/common/logo-transparent.png

flutter_app_name:
  name: "Xlist"

flutter_gen:
  output: lib/gen/
  line_length: 80

flutter_icons:
  android: true
  image_path: "assets/common/logo.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/common/
    - assets/images/

dependency_overrides:
  # syncfusion_flutter_pdfviewer 要 uuid ^4.1.0，vivysub_utils 0.2.0 要 ^3.0.6，
  # 区间不兼容（实测移除后 pub get 直接失败），必须保留此钉。
  uuid: ^4.5.0
