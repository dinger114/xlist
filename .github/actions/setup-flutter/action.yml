name: Setup Flutter
description: Java + Flutter SDK + caches + pub get + build_runner

inputs:
  flutter-version:
    description: Flutter SDK version
    default: '3.47.5'
  run-build-runner:
    description: Whether to run build_runner (needed when .g.dart files are used)
    default: 'true'
  cache-gradle:
    description: Enable Gradle dependency caching (only useful for Android builds)
    default: 'false'

runs:
  using: composite
  steps:
    # cache-gradle 只在真的跑 Android 构建时才开：CI job 不碰 Gradle，
    # 开了会因 ~/.gradle 不存在而报 Path Validation Error。
    - name: Setup Java 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
        cache: ${{ inputs.cache-gradle == 'true' && 'gradle' || '' }}

    # subosito/flutter-action 自带 Flutter SDK 与 pub 依赖两级缓存
    # （日志里的 "Cache Flutter" / "Cache pub dependencies"），无需手写 actions/cache。
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: stable
        cache: true

    - name: Install dependencies
      shell: bash
      run: flutter pub get

    - name: Generate code
      if: inputs.run-build-runner == 'true'
      shell: bash
      run: dart run build_runner build --delete-conflicting-outputs
