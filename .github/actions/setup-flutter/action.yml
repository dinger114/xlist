name: Setup Flutter
description: Java + Flutter SDK + pub/Gradle caches + pub get + build_runner

inputs:
  flutter-version:
    description: Flutter SDK version
    default: '3.47.5'
  run-build-runner:
    description: Whether to run build_runner (needed when .g.dart files are used)
    default: 'true'

runs:
  using: composite
  steps:
    # cache: gradle 需要仓库里有 gradle wrapper（android/gradlew 已存在）
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: stable
        cache: true

    # flutter-action 的 cache 只缓存 SDK 本身，pub 包仍需每次下载。
    # 只缓存 ~/.pub-cache：不缓存 .dart_tool，避免 build_runner 增量状态变脏。
    - name: Cache pub packages
      uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
        restore-keys: pub-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: flutter pub get

    - name: Generate code
      if: inputs.run-build-runner == 'true'
      shell: bash
      run: dart run build_runner build --delete-conflicting-outputs
