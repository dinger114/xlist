name: Setup Flutter
description: Java + Flutter SDK + Gradle/pub caches + pub get + build_runner

inputs:
  flutter-version:
    description: Flutter SDK version
    default: '3.47.5'
  run-build-runner:
    description: Whether to run build_runner (needed when .g.dart files are used)
    default: 'true'

runs:
  using: composite
  steps:
    # setup-java 的 cache: gradle 自带 maven/gradle 缓存（含 gradle wrapper 发行包），
    # 无需再手写 actions/cache。
    - name: Setup Java 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle

    # subosito/flutter-action 自带 pub 依赖缓存（日志中会看到
    # "Cache pub dependencies"），因此不再手写 actions/cache 缓存 ~/.pub-cache
    # —— 那一步会因路径不存在而报 Path Validation Error。
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: stable
        cache: true

    - name: Install dependencies
      shell: bash
      run: flutter pub get

    - name: Generate code
      if: inputs.run-build-runner == 'true'
      shell: bash
      run: dart run build_runner build --delete-conflicting-outputs
