name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # 只构建 arm64-v8a（abiFilters 见 android/app/build.gradle）。
      # -Pdisable-abi-filtering=true 必需：Flutter Gradle Plugin 否则会用
      # PLATFORM_ABI_LIST 覆盖工程里设的 abiFilters。
      - name: Build APK
        run: flutter build apk --release -Pdisable-abi-filtering=true

      - name: Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: xlist-arm64-v8a
          path: build/app/outputs/flutter-apk/app-release.apk
