name: Test

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (errors only)
        run: |
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings > analyze.log || true
          if grep -qE '^\s*error' analyze.log; then
            echo "::error::flutter analyze found errors:"
            grep -E '^\s*error' analyze.log
            exit 1
          fi
          echo "No analyze errors."
          grep -cE '^\s*(info|warning)' analyze.log || echo "0 infos/warnings"

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
