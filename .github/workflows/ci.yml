name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  analyze-test:
    name: Format, Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter
        with:
          run-build-runner: 'true'

      # 必须在 setup（含 flutter pub get）之后跑。
      # dart format 会读 analysis_options.yaml 里的 package:flutter_lints，
      # 没有 .dart_tool/package_config.json 就解析不到，格式化规则不同，
      # 会误报 67 个文件「格式不对」（实测）。
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      # --no-fatal-infos --no-fatal-warnings 表示只有 error 才返回非零，
      # 不需要 `|| true` + grep 兜底。
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        # --no-pub 必需：否则 pub 的解析日志会混进 stdout，
        # 让 test-results.json 不是纯 JSON，test-reporter 解析失败。
        run: flutter test --no-pub --coverage --machine > test-results.json

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Flutter Tests
          path: test-results.json
          reporter: flutter-json

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14
