name: Dependency Update Check

# Dependabot 只按 pubspec.yaml 的约束版本开 PR；`flutter pub outdated` 还能
# 发现被约束卡住的可升级项、以及已停更（discontinued）的包。
# 这里每周一跑一次，结果写进 job summary 并留 artifact。
#
# 注意：本仓库 issues 是关闭的（has_issues=false），所以不在这里建 issue，
# 结果通过 run summary 查看。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'   # 每周一 09:00 CST
  push:
    branches: [master]
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/dependency-check.yml'

permissions:
  contents: read

jobs:
  outdated:
    name: flutter pub outdated
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter
        with:
          run-build-runner: 'false'

      # pub outdated 在有可升级项时返回非零，加 || true 以免整个 job 失败
      - name: Check outdated
        run: |
          flutter pub outdated --no-dev-dependencies > outdated.txt || true
          echo "=== 摘要 ==="
          tail -25 outdated.txt

      - name: Write job summary
        run: |
          {
            echo "## 依赖更新检测"
            echo
            echo "由 \`dependency-check\` workflow 生成（每周一 09:00 CST）。"
            echo
            echo '```'
            cat outdated.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: pub-outdated
          path: outdated.txt
          retention-days: 90
