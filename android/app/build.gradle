plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "io.xlist"
    compileSdkVersion 37
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "io.xlist"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        // 只打包 arm64-v8a：真机都是 64 位 ARM，去掉 v7a/x86_64
        // 可显著减小体积与构建时间。
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            // AGP 9 起 release 默认启用 R8（minifyEnabled 默认 true），
            // 必须显式挂上 keep 规则，否则 Room/WorkManager 反射实例化失败。
            minifyEnabled true
            // Phase 4 / Task 4.4：开启资源收缩，配合 shrinkResources 需 minify 已开。
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    // Phase 4：让 native 库在 APK 内被压缩而非原样存储。
    // AGP 9 默认 useLegacyPackaging=false，即 extractNativeLibs=false，
    // 要求 .so 页对齐并**不做压缩**，于是 libmpv/libflutter/libapp 等
    // 37MB 的 .so 全部以 STORED 进包（压缩后体积=原始体积）。
    // 打开 legacy packaging 后按 deflate 压缩存储，APK 立减约 30%；
    // 代价是安装时解压到 data 目录、启动略慢、占 ROM 更多。
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
