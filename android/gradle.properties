org.gradle.jvmargs=-Xmx8G
org.gradle.parallel=true
# 注意：不要在这里写 org.gradle.java.home 把 JDK 钉死成绝对路径 —— 那对别的
# 机器/CI 不通用（路径不存在时 Gradle 直接报错，不会回退）。
# JAVA_HOME 由构建入口负责指向 JDK 17：
#   - CI：.github/actions/setup-flutter 里的 actions/setup-java（java-version: '17'）
#   - 本机：Makefile 自动解析（/usr/libexec/java_home -v 17）
# 必须 >= 17：本机 PATH 上的 java 若是 26，AGP 9 的 JdkImageTransform 会用它的
# jlink 处理 core-for-system-modules.jar 并失败（--disable-plugin system-modules）。
android.useAndroidX=true
android.enableJetifier=true
# R8 full mode（Phase 4 / Task 4.1）：更激进的类合并与未用代码剥离。
# 若出现 release 才崩的 ClassNotFound/NoSuchMethod，优先在此关闭定位，
# 再往 app/proguard-rules.pro 补 keep 规则而不是长期关掉 full mode。
android.enableR8.fullMode=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# AGP 9 起 getDefaultProguardFile('proguard-android.txt') 默认被禁；
# 部分未适配的插件（flutter_inappwebview_android 1.1.3）仍在用，先开回兼容开关。
# 待插件升级到 proguard-android-optimize.txt 后移除此行。
android.r8.proguardAndroidTxt.disallowed=false
