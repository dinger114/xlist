buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// AGP 8 requires a namespace; some discontinued plugins never migrated.
// Inject it from the plugin's group so we don't have to fork them.
//
// 用闭包 + state.executed 判断来配置，而不是无条件 afterEvaluate：
// 某些插件（如 android_file_picker 2.x）自带 buildscript 声明自己的 AGP，
// 会改变模块求值顺序，导致轮到本块时子项目已经求值完毕，此时再调
// afterEvaluate 会抛 "Cannot run Project.afterEvaluate(Closure) when the
// project is already evaluated"。已求值的直接配置即可。
def configureAndroidModule = { project ->
    if (!project.hasProperty('android')) {
        return
    }
    def androidExt = project.android
    if (androidExt.namespace == null) {
        androidExt.namespace = project.group.toString()
    }
    // AGP 9 起 AAR metadata 校验更严：插件若把 compileSdk 钉在旧版本
    // (dynamic_color=31 / audio_session,audio_service=33)，消费方编译就会
    // 失败。这里统一抬到 app 的 compileSdk，避免 fork 每个插件。
    if (project.plugins.hasPlugin('com.android.library')) {
        androidExt.compileSdkVersion 37
    }
    // Align Kotlin jvmTarget with Java compatibility to avoid
    // "Inconsistent JVM Target Compatibility" build failures in
    // old plugins whose java target is 1.8 but kotlin defaults to 17.
    androidExt.compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // 只有真正应用了 Kotlin 插件的模块才有 kotlinOptions。
    if (project.plugins.hasPlugin('org.jetbrains.kotlin.android')) {
        androidExt.kotlinOptions {
            jvmTarget = '17'
        }
    }
}

subprojects { project ->
    if (project.state.executed) {
        configureAndroidModule(project)
    } else {
        project.afterEvaluate { configureAndroidModule(project) }
    }
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
