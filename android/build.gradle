buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// AGP 9 下的坑：file_picker 11+ 之类的插件带 Kotlin 源码，却用 `isAgp9OrAbove`
// 判断跳过了 apply plugin: 'org.jetbrains.kotlin.android'，默认指望 AGP 9 的
// 内建 Kotlin。本工程 android.builtInKotlin=false（置 true 会让 9 个各自 apply
// KGP 的插件冲突），内建 Kotlin 并不存在，于是 FilePickerPlugin.kt 根本没被编译，
// GeneratedPluginRegistrant 就报 "cannot find symbol: class FilePickerPlugin"。
// 给「有 kotlin 源码但未应用 kotlin 插件」的插件补上。必须在下面的 afterEvaluate
// 之前生效。
subprojects {
    project.plugins.withId('com.android.library') {
        def ktSrc = new File(project.projectDir, 'src/main/kotlin')
        if (ktSrc.directory && !project.plugins.hasPlugin('org.jetbrains.kotlin.android')) {
            project.pluginManager.apply('org.jetbrains.kotlin.android')
        }
    }
}

// AGP 8 requires a namespace; some discontinued plugins never migrated.
// Inject it from the plugin's group so we don't have to fork them.
// Register the afterEvaluate hook BEFORE evaluationDependsOn forces ':app'
// to be evaluated (afterEvaluate on an evaluated project throws).
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            def androidExt = project.android
            if (androidExt.namespace == null) {
                androidExt.namespace = project.group.toString()
            }
            // AGP 9 起 AAR metadata 校验更严：插件若把 compileSdk 钉在旧版本
            // (dynamic_color=31 / audio_session,audio_service=33)，消费方编译就会
            // 失败。这里统一抬到 app 的 compileSdk，避免 fork 每个插件。
            if (project.plugins.hasPlugin('com.android.library')) {
                androidExt.compileSdkVersion 37
            }
            // Align Kotlin jvmTarget with Java compatibility to avoid
            // "Inconsistent JVM Target Compatibility" build failures in
            // old plugins whose java target is 1.8 but kotlin defaults to 17.
            androidExt.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            // 只有真正应用了 Kotlin 插件的模块才有 kotlinOptions。
            if (project.plugins.hasPlugin('org.jetbrains.kotlin.android')) {
                androidExt.kotlinOptions {
                    jvmTarget = '17'
                }
            }
        }
    }
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
